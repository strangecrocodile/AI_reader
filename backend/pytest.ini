[pytest]
testpaths = tests
; tmp_path 默认落在系统临时目录。某些环境里那个目录会残留 ACL 异常的
; `pytest-of-<用户名>` 目录，一旦出现就再也建不了，导致所有用 tmp_path 的用例
; 在 setup 阶段 `PermissionError: [WinError 5]`（不是代码问题，删掉那个目录即可，
; 但受限环境下删不掉）。固定在 backend/data/.pytest_tmp（backend/data/ 已 gitignore），
; 测试就不再受系统临时目录状态影响。
; basetemp 不是 ini 选项，只能经 addopts 传；相对路径按 rootdir 解析。
addopts = --basetemp=data/.pytest_tmp
